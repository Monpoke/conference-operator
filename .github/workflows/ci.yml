# Typage et tests, à chaque poussée et à chaque proposition.
#
# La suite entière tient en moins d'une minute : rien ne justifie de la
# découper, ni de ne la lancer qu'au moment de fusionner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Appelée telle quelle par `release.yml`. Rien ne se publie sans avoir passé
  # exactement la vérification d'une proposition ordinaire, et il n'y a qu'un
  # seul endroit qui la décrit.
  workflow_call:

# Une proposition qu'on pousse trois fois de suite n'occupe qu'un coureur : les
# exécutions précédentes n'ont plus rien à dire.
concurrency:
  # Préfixe littéral, et non `github.workflow` : appelée depuis `release.yml`,
  # cette expression rendrait « Release » et le groupe se confondrait avec celui
  # de l'appelant — qui s'annulerait lui-même en lançant sa propre vérification.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      # Aucun test ne démarre Electron — toute la logique du client de salle vit
      # en dehors, c'est précisément ce qui rend le mode « headless » possible.
      # Éviter le binaire épargne une centaine de mégaoctets par exécution.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      # La version de pnpm est figée par le champ `packageManager` du
      # package.json : corepack la lit, et personne n'a à la répéter ici.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typage
        run: pnpm typecheck

      # Recompile aussi la feuille Tailwind et la compare à celle qui est
      # committée : une classe ajoutée dans une page sans régénération n'a
      # aucun style, et rien d'autre ne l'attraperait.
      - name: Tests
        run: pnpm test

      # Les bundles, parce que ni le typage ni les tests ne les construisent.
      #
      # Vite et Tailwind échouent sur des choses qu'aucun des deux ne voit : un
      # `@source` vers un dossier disparu, un import que le bundler ne résout
      # pas, une feuille qui ne compile plus. Sans cette étape, la panne
      # n'apparaît qu'au déploiement du hub ou à l'empaquetage du client — chez
      # quelqu'un, sur sa machine, la semaine d'avant l'événement.
      - name: Bundles
        run: pnpm build

  # Les messages de commit de la proposition, contre `commitlint.config.js`.
  #
  # Sur proposition seulement. L'historique d'avant la convention ne la suit
  # pas, et une plage calculée sur une poussée directe le rejouerait. C'est le
  # hook `commit-msg` qui couvre les commits poussés sans passer par une
  # proposition — il est posé par `prepare`, donc à l'installation.
  messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint lit une plage de commits : un clone superficiel n'a pas
          # la base de la proposition.
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--ignore-scripts` : ce job ne construit rien, et le seul script du
      # graphe compile better-sqlite3.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Messages de commit
        run: >
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
