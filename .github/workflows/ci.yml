# Types and tests, on every push and every pull request.
#
# The whole suite runs in under a minute: nothing justifies splitting it up, nor
# running it only at merge time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called as is by `release.yml`. Nothing ships without having passed exactly
  # the check an ordinary pull request goes through, and only one place describes
  # it.
  workflow_call:

# A pull request pushed three times in a row occupies only one runner: the
# earlier runs have nothing left to say.
concurrency:
  # A literal prefix, not `github.workflow`: called from `release.yml`, that
  # expression would render as "Release" and the group would collide with the
  # caller's — which would cancel itself by launching its own verification.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # No test starts Electron — the whole of the room client's logic lives
      # outside it, which is precisely what makes the "headless" mode possible.
      # Avoiding the binary saves a hundred megabytes or so per run.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

    steps:
      - uses: actions/checkout@v4

      # pnpm's version is pinned by the package.json's `packageManager` field:
      # corepack reads it, and nobody has to repeat it here.
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      # This also recompiles the Tailwind sheet and compares it to the committed
      # one: a class added to a page without regenerating has no style at all, and
      # nothing else would catch it.
      - name: Tests
        run: pnpm test

      # The bundles, because neither the typecheck nor the tests build them.
      #
      # Vite and Tailwind fail on things neither of the other two sees: an
      # `@source` pointing at a vanished folder, an import the bundler does not
      # resolve, a sheet that no longer compiles. Without this step the breakage
      # only shows up when deploying the hub or packaging the client — at
      # somebody's desk, on their machine, the week before the event.
      - name: Bundles
        run: pnpm build

  # The pull request's commit messages, against `commitlint.config.js`.
  #
  # On pull requests only. The history from before the convention does not follow
  # it, and a range computed on a direct push would replay it. The `commit-msg`
  # hook is what covers commits pushed without going through a pull request — it
  # is installed by `prepare`, so at install time.
  messages:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint reads a range of commits: a shallow clone does not have
          # the pull request's base.
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # `--ignore-scripts`: this job reads commit messages, it builds nothing —
      # no need for the esbuild and Electron binaries the install would fetch.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Commit messages
        run: >
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
