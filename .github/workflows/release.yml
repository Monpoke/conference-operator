# Ship a version: one hub image, one control-room installer.
#
# The hub and the room client speak the same oRPC contract, versioned nowhere
# but in this repository. Shipping them separately would raise the question
# "which image goes with which installer?", and nothing here could answer it. So
# a tag produces both, together, under the same number.
#
# That number exists only here. The `package.json` files stay at `0.0.0` and
# `private: true` — none of them is published to an npm registry, and keeping
# version bookkeeping nobody reads would be worse than having none. The git tag
# is the single source, injected at packaging time.
name: Release

on:
  push:
    tags: ['v*']
  # The rehearsal. Builds both packages without publishing anything: the
  # installer goes out as an artifact (90 days), the image never leaves the
  # runner. This is what lets the packaging chain be exercised the week before,
  # without burning a version number or pushing anything public.
  workflow_dispatch:

concurrency:
  # No cancellation here, unlike CI: a half-finished release would leave an
  # image without its installer, or the other way round.
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Types, tests and bundles, exactly as for any pull request. Nothing ships
  # behind a red suite.
  verify:
    uses: ./.github/workflows/ci.yml

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Provenance: a Sigstore signing certificate is minted from the job's OIDC
      # identity, and the attestation is recorded against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # `GITHUB_TOKEN` is enough: GHCR asks for no third-party account, and
      # hosting a public package there is free. No login on a rehearsal — there
      # is nothing to push.
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags and OCI labels are derived from the git tag; the Dockerfile knows
      # nothing about any of it. `latest` follows stable versions only — a
      # `v1.2.0-rc.1` does not move it, which `metadata-action` handles on its
      # own.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/hub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=rehearsal,enable=${{ github.event_name == 'workflow_dispatch' }}

      # `linux/amd64` only, and deliberately so. The Dockerfile carries just the
      # linux-x64 and linuxmusl-x64 `better-sqlite3` binaries — the other six are
      # fifteen megabytes that would never be used. An arm64 image built from
      # this recipe would stop at the module's first load, on startup, inside a
      # container. Opening up the architecture means reopening that pruning
      # first — and building on an ARM runner, since QEMU translation costs more
      # here than it returns.
      #
      # On the cache: the pnpm install layers are already isolated in the
      # Dockerfile — manifests first, sources after. A release that only changes
      # code therefore reuses the whole install.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance and SBOM only mean something attached to a pushed image:
          # a rehearsal produces no manifest to attach them to.
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}

      # GHCR only accepts a lowercase name, and the repository's own need not be
      # one. `metadata-action` lowercases what it is given; this action does not,
      # and would sign a name nobody can resolve.
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/hub" >> "$GITHUB_OUTPUT"

      # Signed provenance for the image: which workflow, at which commit, built
      # this exact digest. It is not the same thing as the `provenance: mode=max`
      # above — BuildKit's is unsigned metadata carried inside the image, this one
      # is a Sigstore attestation anyone can verify without pulling anything:
      #
      #   gh attestation verify oci://<image>:<version> --repo <owner>/<repo>
      #
      # A rehearsal pushes no image, so there is no digest to attest. And this
      # runs *after* the push on purpose: a release whose attestation fails still
      # has its image, and the step can be replayed.
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # The attestation travels with the image, for whoever reads the
          # registry rather than the repository.
          push-to-registry: true

  installer:
    needs: verify
    permissions:
      contents: read
      # Same as the image job: the provenance attestation is signed against this
      # job's OIDC identity.
      id-token: write
      attestations: write
    # Windows rather than Ubuntu, even though packaging does work from Linux
    # (see the README). It saves installing 32-bit wine and its opaque "exit
    # status 123", and a Windows runner is free on a public repository. The
    # Linux recipe keeps its purpose — packaging from a dev machine — but it
    # does not have to be the path a release takes.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # No `ELECTRON_SKIP_BINARY_DOWNLOAD` here, unlike CI: that binary is
      # precisely what is being packaged.
      - run: pnpm install --frozen-lockfile

      # `0.0.0` in the manifests, the real number here. It names the installer
      # and the Windows "Add/Remove programs" entry; without it three successive
      # versions would install over one another under the same name, and nobody
      # on site could say which one is running.
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "number=0.0.0-rehearsal.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # What `package:win` does, plus the version number. Order matters: the
      # control-room bundle travels inside the installer's `resources`, so it has
      # to exist before electron-builder goes looking for it.
      - shell: bash
        run: |
          pnpm --filter @conference-operator/control-web build
          pnpm --filter @conference-operator/room-client build
          pnpm --filter @conference-operator/room-client exec electron-builder \
            --win --publish never \
            -c.extraMetadata.version=${{ steps.version.outputs.number }}

      # The binary is unsigned — SmartScreen will warn on first launch. A
      # published checksum is the least that can be offered to whoever copies the
      # installer onto a USB stick on the morning of an event. Written with LF
      # endings, so that `sha256sum -c` can read it back outside Windows.
      - shell: pwsh
        working-directory: apps/room-client/release
        run: |
          $exe = Get-ChildItem -Filter *.exe | Select-Object -First 1
          $digest = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD/SHA256SUMS-windows.txt", "$digest  $($exe.Name)`n")
          Get-Content SHA256SUMS-windows.txt

      # `regie-windows-`, and the checksums named after their platform: the two
      # packaging jobs land in the same folder in `release` (`merge-multiple`),
      # where a shared `SHA256SUMS.txt` would silently overwrite the other's.
      - uses: actions/upload-artifact@v4
        with:
          name: regie-windows-${{ steps.version.outputs.number }}
          path: |
            apps/room-client/release/*.exe
            apps/room-client/release/SHA256SUMS-windows.txt
          retention-days: 90

      # Source maps, kept out of the release on purpose. Nothing installs them —
      # no code turns on `--enable-source-maps` on a room machine — and they are
      # not lost either: `build-main.mjs` has no non-deterministic input and the
      # toolchain is pinned by the lockfile, so building this tag again
      # regenerates them, `sourcesContent` included.
      #
      # Ninety days is the ceiling a public repository allows, and it happens to
      # be the window that matters: the event, and the weeks after it, when a
      # trace coming back from a room is still worth reading without rebuilding
      # anything.
      - uses: actions/upload-artifact@v4
        with:
          name: sourcemaps-${{ steps.version.outputs.number }}
          path: |
            apps/room-client/dist/*.map
            apps/control-web/dist/**/*.map
          retention-days: 90

      # Signed provenance for the installer, and the one thing this repository
      # can offer whoever copies an `.exe` onto a USB stick on the morning of an
      # event: not that the binary is safe, but that it is *this* repository's,
      # built by this workflow at this commit.
      #
      #   gh attestation verify regie-de-salle-X.Y.Z.exe --repo <owner>/<repo>
      #
      # It replaces nothing. The binary stays unsigned, SmartScreen still warns,
      # and `SHA256SUMS.txt` still answers a different question — "is this the
      # file the release published?" — without needing a network or the `gh` CLI.
      #
      # After the upload on purpose: an attestation that fails leaves the
      # installer in the run's artifacts all the same.
      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: apps/room-client/release/*.exe

  # The same application for a room machine that does not run Windows. Its own
  # job rather than a matrix over the two: the Windows one needs wine to be
  # avoided and writes its checksum in PowerShell, this one needs neither, and
  # a matrix would spend its lines re-introducing the differences it flattened.
  #
  # Nothing to install beyond the usual: electron-builder fetches appimagetool
  # itself, and FUSE is only needed to *run* an AppImage, never to build one.
  installer-linux:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Like the Windows job, and unlike CI: the Electron binary is what is being
      # packaged here.
      - run: pnpm install --frozen-lockfile

      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "number=0.0.0-rehearsal.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # `package:linux`, plus the version number. Same order and same reason as
      # on Windows: the control-room bundle travels inside `resources`.
      - run: |
          pnpm --filter @conference-operator/control-web build
          pnpm --filter @conference-operator/room-client build
          pnpm --filter @conference-operator/room-client exec electron-builder \
            --linux --publish never \
            -c.extraMetadata.version=${{ steps.version.outputs.number }}

      # Two files, so `sha256sum` writes both lines at once — and reads back with
      # `sha256sum -c` from the folder they were copied into.
      - working-directory: apps/room-client/release
        run: sha256sum *.AppImage *.tar.gz | tee SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: regie-linux-${{ steps.version.outputs.number }}
          path: |
            apps/room-client/release/*.AppImage
            apps/room-client/release/*.tar.gz
            apps/room-client/release/SHA256SUMS-linux.txt
          retention-days: 90

      - uses: actions/attest-build-provenance@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: |
            apps/room-client/release/*.AppImage
            apps/room-client/release/*.tar.gz

  release:
    # A rehearsal stops here: both packages were built, neither is published.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, installer, installer-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: regie-*
          merge-multiple: true
          path: artifacts

      # The release notes stay in French, like the README and the RUNBOOK: they
      # are read by the people who run the event, not by the people who maintain
      # the workflow.
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` works out which repository to talk to by reading the git remote,
          # and this job never checks the sources out — it downloads the two
          # artifacts the other jobs produced, and that is all it needs. Without
          # this it stops on "failed to run git: not a git repository". Naming the
          # repository outright costs less than cloning one for a single command.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # GHCR only accepts lowercase; the repository name need not be.
          image="ghcr.io/${GITHUB_REPOSITORY,,}/hub:${version}"
          runbook="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/apps/room-client/RUNBOOK.md"

          # A tag carrying a dash (`v1.2.0-rc.1`) is a pre-release: it does not
          # show up as the repository's latest version.
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          cat > notes.md <<EOF
          ## Le hub

          \`\`\`bash
          docker run -d --name hub -p 8787:8787 \\
            -e BETTER_AUTH_SECRET="\$(openssl rand -base64 48)" \\
            -e PUBLIC_URL=https://hub.exemple.fr \\
            -v hub-data:/data \\
            ${image}
          \`\`\`

          Image \`linux/amd64\`. La console et la régie mobile y sont, servies par
          le hub — il n'y a rien d'autre à déployer de ce côté.

          Provenance signée, si vous voulez vérifier d'où sort cette image :

          \`\`\`bash
          gh attestation verify oci://${image} --repo ${GITHUB_REPOSITORY}
          \`\`\`

          ## La régie de salle

          La même application en deux paquets : **installeur NSIS x64** pour
          Windows, **AppImage et tar.gz x64** pour Linux. Vérifier l'empreinte
          avant de recopier un fichier :

          \`\`\`bash
          sha256sum -c SHA256SUMS-windows.txt
          sha256sum -c SHA256SUMS-linux.txt
          \`\`\`

          Sous Linux, l'AppImage se copie et se lance telle quelle
          (\`chmod +x\`). Si la machine n'a pas FUSE 2 — Ubuntu ne l'installe
          plus par défaut depuis la 22.04 — au choix
          \`--appimage-extract-and-run\`, ou l'archive \`tar.gz\` qui n'en
          demande pas : on l'extrait et on lance \`regie-de-salle\`.

          Et, avec le réseau et la \`gh\` CLI, de quel dépôt et de quel commit
          ils sortent — ce que l'empreinte seule ne dit pas :

          \`\`\`bash
          gh attestation verify regie-de-salle-${version}.exe --repo ${GITHUB_REPOSITORY}
          gh attestation verify regie-de-salle-${version}.AppImage --repo ${GITHUB_REPOSITORY}
          \`\`\`

          ⚠️ Cette provenance **n'est pas une signature de code** : le binaire
          Windows n'est pas signé, SmartScreen avertira au premier
          lancement. Installer les machines **avant** le jour J, pas devant une
          salle qui attend. Procédures d'exploitation : [RUNBOOK](${runbook}).

          ---

          Cette image et cet installeur vont ensemble : ils partagent le même
          contrat oRPC. Les mélanger entre deux versions n'est pas prévu.
          EOF

          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${prerelease[@]}"
