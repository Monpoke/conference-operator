<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Console — Cloud Nord</title>
  </head>
  <body class="bg-canvas font-sans text-text">
    <!--
      Development only.

      In production the hub renders this shell itself, because it injects into it
      what the console has to know before its first call: the mode, the event's
      name, and whether the Google button has any reason to exist. This file only
      exists so that `vite dev` has a way in.
    -->
    <div id="console-root"></div>
    <script id="console-boot" type="application/json">{"mode":"dev","event":{"name":"Cloud Nord (dev)","shortName":"Cloud Nord"},"google":null}</script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
