# The **application**'s identity, not the event's.
#
# What the product displays — window titles, screens, public wall — comes from the
# hub and follows the imported event; nothing here needs to change from one
# edition to the next. These three lines name the software installed on the room
# machine, and `appId` in particular is not renamed lightly: Electron derives the
# `userData` folder from it, hence the local database — the programme cache and an
# unflushed outbound queue.
#
# It was renamed once, when the software stopped being named after the event that
# first ran it (`fr.cloudnord.roomclient`). A room installed before that keeps its
# old folder, which the new build no longer reads: it comes up unpaired, and has
# to be approved again from the console. Nothing is lost that a pairing does not
# rebuild — but it has to be done before the day, not in front of a room.
appId: fr.conference-operator.roomclient
productName: Régie de salle
copyright: Conference Operator

directories:
  output: release
  buildResources: build

# The default name — `${productName} Setup ${version}.exe` — carries a space and
# an accent: readable in a folder, it becomes a release URL escaped from end to
# end, and a filename `sha256sum -c` trips over. The product keeps its name
# everywhere anyone reads it: shortcut, Start menu, uninstaller. Here, it is a
# filename.
#
# `${version}` is `0.0.0` from the repository, and the real number on a release —
# `release.yml` injects it through `-c.extraMetadata.version`, the monorepo's
# manifests having no version of their own.
artifactName: regie-de-salle-${version}.${ext}

files:
  - dist/**
  # The source map does not travel to the control machine: nothing turns on
  # `--enable-source-maps` in the client, it would be eight megabytes there that
  # nobody opens.
  #
  # It is not lost for all that, and it is no longer "the build machine" that keeps
  # it — since `release.yml` does the packaging, that machine is a runner destroyed
  # at the end of the job. Two paths lead back to it:
  #
  #  - **Rebuild from the tag.** `scripts/build-main.mjs` has no non-deterministic
  #    input and esbuild is pinned by the lockfile: a
  #    `pnpm --filter @conference-operator/room-client build` on `vX.Y.Z` gives back the same
  #    map. It embeds `sourcesContent`, so it reads back on its own.
  #  - **The `sourcemaps-X.Y.Z` artefact** from the run that published the version,
  #    for 90 days — the event and the weeks after it, when a trace coming back
  #    from a room deserves reading without rebuilding anything.
  - "!dist/*.map"
  - package.json
  # The local schema's migrations: read at start-up from the package.
  - "!node_modules/**"
  - node_modules/better-sqlite3/**
  # `better-sqlite3` ships one binary per platform — eight, of which a package can
  # only ever use one. The six left out (macOS, arm, musl) were eleven megabytes
  # carried all the way to the control machine for nothing. The order matters: the
  # negation first, the reinstatement after.
  #
  # Both packaged platforms are listed here rather than under `win:` and `linux:`.
  # Two megabytes travel with each package for nothing, and that is the price of a
  # list that cannot silently ship the wrong binary: whether electron-builder
  # merges a platform's `files` with the common ones or replaces them is not
  # something a room should discover on `better_sqlite3.node` at start-up.
  - "!node_modules/better-sqlite3/prebuilds/*"
  - node_modules/better-sqlite3/prebuilds/win32-x64.node
  - node_modules/better-sqlite3/prebuilds/linux-x64.node
  # And nothing that serves to *compile* the library: SQLite's C amalgamation
  # weighs ten megabytes on its own, for a binary that is never built on the
  # machine — it already travels ready-made just above.
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"

# Chromium embeds its translations, fifty-five languages and 47 MB, for an
# application that speaks nothing but French. English is kept as a fallback: it is
# the language Chromium falls back to for its own strings (context menus, network
# messages) if the requested file is missing.
electronLanguages:
  - fr
  - en-US

# LZMA at maximum rather than the default. An installer is built once and copied
# onto three machines: the compression time is paid once, the megabytes on every
# copy to a USB stick on an event morning.
compression: maximum

extraResources:
  # The client migrates its database at start-up; the SQL files have to travel
  # with it.
  - from: ../../packages/db/migrations/client
    to: migrations/client
  # The control app's bundle. Outside the asar, and at this exact place:
  # `resolveControlBundle` walks up the folders from the main process's bundle
  # until it finds `apps/control-web/dist`, exactly as it does from the sources.
  #
  # Without its source map, for the same reason as the main process's, and it is
  # found again by the same two paths — a rebuild from the tag, or the
  # `sourcemaps-X.Y.Z` artefact. This one has a third life: the hub serves the same
  # bundle for the mobile control app, and the `Dockerfile` copies the whole `dist`
  # there, map included.
  - from: ../control-web/dist
    to: apps/control-web/dist
    filter:
      - "**/*"
      - "!**/*.map"

win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned, SmartScreen will warn on first launch: plan to install it before the
  # day, not in front of a room that is waiting.
  signAndEditExecutable: false

# The same application, for a room machine that does not run Windows. Two formats
# rather than one, and not for symmetry:
#
#  - **AppImage** is the one-file equivalent of the installer — copy it, `chmod
#    +x`, run. It needs FUSE 2, which Ubuntu has not shipped by default since
#    22.04; `--appimage-extract-and-run` gets around it, but that is a thing to
#    know on the morning of an event rather than discover.
#  - **tar.gz** knows nothing of FUSE. Extract, run `regie-de-salle`. It is the
#    format that cannot fail, and the reason the AppImage is allowed to be the
#    convenient one.
#
# No `deb`: it installs system-wide, asks for root, and ties the package to one
# family of distributions — three things a machine prepared before the event does
# not need.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
  # The freedesktop category, from which the desktop entry is derived. Nothing
  # reads it on a machine that boots straight into the application, but leaving it
  # out makes electron-builder guess.
  category: AudioVideo
  # `productName` would give a binary called `Régie de salle` — a space and an
  # accent to quote at every invocation, in a shell, over SSH, in a systemd unit.
  # The product keeps its name where it is read; here, it is a command.
  executableName: regie-de-salle
  # And names the `.desktop` entry after it — `regie-de-salle.desktop` rather than
  # the default `Régie de salle.desktop`, a filename with a space and an accent
  # for the same reasons as above.
  #
  # It does not fully settle window association: the entry carries
  # `StartupWMClass=Régie de salle`, which is what Electron reports under X11, so
  # the launcher and the window match there. Under Wayland the association goes
  # through an `app_id` the main process would have to declare — application
  # work, not packaging, and nothing a room notices today.
  syncDesktopName: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Régie de salle

# Native modules: NOTHING TO REBUILD, and that is deliberate.
#
# `better-sqlite3` 13 is a **Node-API** module (`NAPI_VERSION=10`) and publishes
# one binary per platform in its npm package — `prebuilds/win32-x64.node` goes into
# the installer as is. Node-API guarantees binary stability between Node and
# Electron: Electron's ABI no longer concerns it, unlike earlier versions of the
# library.
#
# Leaving `npmRebuild: true` therefore returned nothing extra, and FORBADE
# packaging anywhere but on Windows: @electron/rebuild attempts a cross
# compilation node-gyp cannot do, and stops on "node-gyp does not support
# cross-compiling native modules from source".
npmRebuild: false
nodeGypRebuild: false
