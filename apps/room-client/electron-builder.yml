# Identité de l'**application**, pas de l'événement.
#
# Ce qui s'affiche dans le produit — titres de fenêtres, écrans, mur public —
# vient du hub et suit l'événement importé ; rien ici n'a besoin de changer
# d'une édition à l'autre. Ces trois lignes nomment le logiciel installé sur la
# machine de salle, et `appId` en particulier ne se renomme pas à la légère :
# Electron en dérive le dossier `userData`, donc la base locale — cache du
# programme et file de remontée non vidée.
appId: fr.cloudnord.roomclient
productName: Régie de salle
copyright: Cloud Nord

directories:
  output: release
  buildResources: build

# Le nom par défaut — `${productName} Setup ${version}.exe` — porte un espace et
# un accent : lisible dans un dossier, il devient une URL de release échappée de
# part en part, et un nom de fichier que `sha256sum -c` fait trébucher. Le
# produit garde son nom partout où quelqu'un le lit : raccourci, menu Démarrer,
# désinstalleur. Ici, c'est un nom de fichier.
#
# `${version}` vaut `0.0.0` depuis le dépôt, et le vrai numéro en publication —
# `release.yml` l'injecte par `-c.extraMetadata.version`, les manifestes du
# monorepo n'ayant pas de version à eux.
artifactName: regie-de-salle-${version}.${ext}

files:
  - dist/**
  # La source map ne part pas sur le poste de régie : rien n'active
  # `--enable-source-maps` dans le client, elle y serait huit mégaoctets que
  # personne n'ouvre.
  #
  # Elle n'est pas perdue pour autant, et ce n'est plus « la machine de build »
  # qui la garde — depuis que `release.yml` empaquette, cette machine est un
  # coureur détruit à la fin du job. Deux chemins la retrouvent :
  #
  #  - **Reconstruire depuis le tag.** `scripts/build-main.mjs` n'a aucune
  #    entrée non déterministe et esbuild est figé par le lockfile : un
  #    `pnpm --filter @cloudnord/room-client build` sur `vX.Y.Z` redonne la même
  #    map. Elle embarque `sourcesContent`, elle se relit donc seule.
  #  - **L'artefact `sourcemaps-X.Y.Z`** de l'exécution qui a publié la version,
  #    90 jours durant — l'événement et les semaines d'après, quand une trace
  #    remontée d'une salle mérite d'être lue sans rien reconstruire.
  - "!dist/*.map"
  - package.json
  # Migrations du schéma local : lues au démarrage depuis le paquet.
  - "!node_modules/**"
  - node_modules/better-sqlite3/**
  # `better-sqlite3` livre un binaire par plateforme — huit, dont un seul peut
  # servir dans un paquet Windows x64. Les sept autres (macOS, arm, musl)
  # pesaient treize mégaoctets transportés jusqu'au poste de régie pour rien.
  # L'ordre compte : la négation d'abord, la réintégration ensuite.
  - "!node_modules/better-sqlite3/prebuilds/*"
  - node_modules/better-sqlite3/prebuilds/win32-x64.node
  # Et rien de ce qui sert à *compiler* la bibliothèque : l'amalgame C de SQLite
  # pèse à lui seul dix mégaoctets, pour un binaire qu'on ne construit jamais
  # sur le poste — il voyage déjà tout fait juste au-dessus.
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"

# Chromium embarque ses traductions, cinquante-cinq langues et 47 Mo, pour une
# application qui ne parle que français. On garde l'anglais comme repli : c'est
# la langue vers laquelle Chromium retombe pour ses propres chaînes (menus
# contextuels, messages réseau) si le fichier demandé manque.
electronLanguages:
  - fr
  - en-US

# LZMA au maximum plutôt que par défaut. Un installeur se construit une fois et
# se recopie sur trois postes : le temps de compression se paie une seule fois,
# les mégaoctets à chaque copie sur clé USB un matin d'événement.
compression: maximum

extraResources:
  # Le client migre sa base au lancement ; les fichiers SQL doivent voyager avec.
  - from: ../../packages/db/migrations/client
    to: migrations/client
  # Bundle de la régie. Hors de l'asar, et à cette place précise : `resoudreRegie`
  # remonte les dossiers depuis le bundle du processus principal jusqu'à trouver
  # `apps/regie-web/dist`, exactement comme il le fait depuis les sources.
  #
  # Sans sa source map, pour la même raison que celle du processus principal, et
  # elle se retrouve par les deux mêmes chemins — reconstruction depuis le tag,
  # ou artefact `sourcemaps-X.Y.Z`. Celle-ci a une troisième vie : le hub sert le
  # même bundle pour la régie mobile, et le `Dockerfile` y copie `dist` entier,
  # map comprise.
  - from: ../regie-web/dist
    to: apps/regie-web/dist
    filter:
      - "**/*"
      - "!**/*.map"

win:
  target:
    - target: nsis
      arch: [x64]
  # Sans signature, SmartScreen avertira au premier lancement : prévoir de
  # l'installer avant le jour J, pas devant une salle qui attend.
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Régie de salle

# Modules natifs : RIEN À RECOMPILER, et c'est délibéré.
#
# `better-sqlite3` 13 est un module **Node-API** (`NAPI_VERSION=10`) et publie
# dans son paquet npm un binaire par plateforme — `prebuilds/win32-x64.node`
# part tel quel dans l'installeur. Node-API garantit la stabilité binaire entre
# Node et Electron : l'ABI d'Electron ne le concerne plus, contrairement aux
# versions antérieures de la bibliothèque.
#
# Laisser `npmRebuild: true` ne rendait donc rien de plus, et INTERDISAIT
# d'empaqueter ailleurs que sous Windows : @electron/rebuild tente une
# compilation croisée que node-gyp ne sait pas faire, et s'arrête sur
# « node-gyp does not support cross-compiling native modules from source ».
npmRebuild: false
nodeGypRebuild: false
