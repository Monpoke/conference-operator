{{- if and .Values.montage.enabled (not .Values.montage.existingSecret) }}
# Le jeton partagé entre le hub (MONTAGE_WORKER_TOKEN) et ses workers
# (HUB_WORKER_TOKEN). Tiré au hasard au premier `helm install` s'il n'est pas
# dans les values, puis relu dans ce secret aux mises à jour suivantes : voir
# `hub.montageToken`. Comme le secret du hub, il est archivé dans la release Helm.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.montageSecretName" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ include "hub.montageToken" . | b64enc | quote }}
{{- end }}
