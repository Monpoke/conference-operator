{{- if .Values.montage.enabled }}
# Le worker de montage : prend un talk dans la file du hub, le monte, le renvoie.
# Il joint le hub par son service, dans le cluster, et s'y présente avec le jeton
# partagé — le hub l'a déclaré au démarrage, rien à créer dans la console.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hub.montageName" . }}
  labels:
    app.kubernetes.io/name: {{ include "hub.montageName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/part-of: {{ include "hub.name" . }}
spec:
  replicas: {{ .Values.montage.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hub.montageName" . }}
  # Jamais deux versions côte à côte : un worker d'une autre version que le hub
  # est refusé en plein montage.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hub.montageName" . }}
      annotations:
        # Un jeton changé dans les values est une rotation : le pod doit repartir
        # avec. Un jeton tiré par le chart ne change pas, un secret existant se
        # redémarre à la main — comme celui du hub.
        checksum/montage-token: {{ .Values.montage.token | sha256sum }}
        {{- with .Values.montage.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.montage.terminationGracePeriodSeconds }}
      containers:
        - name: {{ include "hub.montageName" . }}
          image: {{ include "hub.montageImage" . | quote }}
          imagePullPolicy: {{ .Values.montage.image.pullPolicy }}
          env:
            # Dans le cluster, droit sur le service du hub.
            - name: HUB_URL
              value: {{ printf "http://%s:%v" (include "hub.name" .) .Values.service.port | quote }}
            - name: HUB_WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "hub.montageSecretName" . }}
                  key: {{ include "hub.montageSecretKey" . }}
            {{- if .Values.montage.ipv4First }}
            - name: NODE_OPTIONS
              value: --dns-result-order=ipv4first
            {{- end }}
            {{- range $key, $value := .Values.montage.extra }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.montage.resources | nindent 12 }}
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir:
            sizeLimit: {{ .Values.montage.workDirSize }}
      {{- with .Values.montage.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.montage.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.montage.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
