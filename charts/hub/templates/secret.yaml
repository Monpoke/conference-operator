{{- if .Values.secret.create }}
# Rendu à partir des values, donc **archivé par Helm** dans le Secret de release
# du namespace, valeurs comprises. Qui peut lire les releases peut les lire. Pour
# que rien de sensible ne passe par là : créer le secret à la main et le désigner
# par `secret.existingSecret`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hub.name" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ .Values.secret.betterAuthSecret | quote }}
  {{- with .Values.secret.google }}
  {{- if .clientId }}
  GOOGLE_CLIENT_ID: {{ .clientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .clientSecret | quote }}
  GOOGLE_HOSTED_DOMAIN: {{ .hostedDomain | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.secret.vapid }}
  {{- if .publicKey }}
  VAPID_PUBLIC_KEY: {{ .publicKey | quote }}
  VAPID_PRIVATE_KEY: {{ .privateKey | quote }}
  {{- end }}
  {{- with .subject }}
  VAPID_SUBJECT: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{- with .Values.secret.s3 }}
  {{- if .accessKeyId }}
  S3_ACCESS_KEY_ID: {{ .accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .secretAccessKey | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.secret.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
