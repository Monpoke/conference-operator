# Le fichier de values à garder pour vous — **hors du dépôt**.
#
# Copiez-le ailleurs que dans le répertoire de travail (un gestionnaire de mots de
# passe, un coffre, `~/.config/conference-operator/`), remplissez-le, et passez-le
# à chaque déploiement :
#
#   helm upgrade --install hub charts/hub \
#     --namespace conference-operator --create-namespace \
#     -f ~/.config/conference-operator/hub-prod.yaml
#
# Ce que ça coûte : Helm archive chaque release dans un Secret du namespace,
# valeurs comprises. Les secrets y sont donc lisibles par qui peut lire les
# releases. Si ce n'est pas acceptable, laissez `secret.create: false`, créez le
# secret à la main et désignez-le par `secret.existingSecret` — c'est la seule
# façon que rien de sensible ne transite par Helm :
#
#   kubectl -n conference-operator create secret generic hub \
#     --from-literal=BETTER_AUTH_SECRET="$(openssl rand -base64 48)"

config:
  # L'adresse publique, celle qu'un navigateur voit.
  publicUrl: "https://hub.cloudnord.exemple.fr"
  programSourceUrl: "https://exemple.fr/programme.json"
  s3:
    endpoint: ""
    bucket: ""
    # Amorce du premier démarrage, comme le bucket : « cn26 » loge l'édition dans
    # un bucket partagé avec les autres.
    prefix: ""

ingress:
  host: "hub.cloudnord.exemple.fr"
  className: nginx
  tls:
    enabled: true
    secretName: hub-tls
  # Avec traefik, le point d'entrée remplace les timeouts d'ingress-nginx :
  # className: traefik
  # annotations:
  #   traefik.ingress.kubernetes.io/router.entrypoints: websecure

image:
  repository: registry.exemple.fr/namespace/hub
  # Laisser vide suit l'appVersion du chart. Un digest l'emporte sur le tag.
  tag: ""
  digest: ""
  # Registre privé qui refuse le pull anonyme :
  # pullSecrets: [regcred]

secret:
  create: true

  # Requis, 32 caractères minimum : openssl rand -base64 48
  # En changer déconnecte tous les opérateurs. Les salles appairées ne bougent pas,
  # leurs jetons vivent dans la base.
  betterAuthSecret: "REMPLACEZ-MOI"

  # Connexion Google Workspace — facultative, mais les trois vont ensemble.
  # hostedDomain **est** la liste des opérateurs : tout compte du domaine en est un,
  # et il est revérifié sur la revendication `hd` du jeton d'identité au retour.
  google:
    clientId: ""
    clientSecret: ""
    hostedDomain: ""

  # Web Push — facultatif. Sans elles, le hub fabrique une paire au premier
  # démarrage et la garde en base. Les poser sert à survivre à une base recréée.
  vapid:
    publicKey: ""
    privateKey: ""
    # Une vraie boîte, que quelqu'un lit : les services de push écrivent à un humain.
    subject: "mailto:contact@exemple.fr"

  # Les clés du stockage des rushes — facultatives. L'adresse et le bucket ne sont
  # pas des secrets : ils sont sous `config.s3` plus haut. Les trois vont ensemble
  # (endpoint + les deux clés) : zéro ou trois.
  #
  # Le compte a besoin de **lister** le bucket, pas seulement d'y écrire : sans
  # `ListBucket`, le hub démarre en annonçant le stockage actif puis échoue en 403
  # sur la reprise des téléversements ouverts.
  s3:
    accessKeyId: ""
    secretAccessKey: ""

persistence:
  size: 1Gi
  # storageClass: ""
