# A template, never applied as it stands: `kubectl apply -k .` ignores it.
#
# Copy it, fill it, keep it out of git — or better, create the secret straight
# from the command line so nothing is written to disk at all:
#
#   kubectl -n conference-operator create secret generic hub \
#     --from-literal=BETTER_AUTH_SECRET="$(openssl rand -base64 48)"
#
# Only `BETTER_AUTH_SECRET` is required. Changing it signs every operator out;
# it does not touch the paired rooms, whose tokens live in the database.
apiVersion: v1
kind: Secret
metadata:
  name: hub
type: Opaque
stringData:
  BETTER_AUTH_SECRET: ""

  # Google Workspace sign-in, optional. The three go together: giving the client
  # id without the hosted domain stops the hub from starting, rather than raising
  # a console whose button fails on every click.
  # GOOGLE_CLIENT_ID: ""
  # GOOGLE_CLIENT_SECRET: ""
  # GOOGLE_HOSTED_DOMAIN: ""

  # Web Push, optional. Without them the hub makes a pair on first start and
  # keeps it in the database; setting them is what survives a database recreated
  # from scratch, since changed keys invalidate every subscription.
  # VAPID_PUBLIC_KEY: ""
  # VAPID_PRIVATE_KEY: ""
  # VAPID_SUBJECT: "mailto:contact@exemple.fr"

  # Shipping the rushes back, optional. The first three go together: two out of
  # three stops the hub from starting, rather than raising a console that
  # announces a storage where every upload fails on its signature.
  # S3_ENDPOINT: ""
  # S3_ACCESS_KEY_ID: ""
  # S3_SECRET_ACCESS_KEY: ""
  # S3_BUCKET: ""
