apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hub
spec:
  # The governing headless service, which a StatefulSet requires. It is what
  # gives the pod its stable name `hub-0.hub-headless`; the ingress keeps going
  # through the ordinary `hub` service.
  serviceName: hub-headless
  # One, and it is not a starting point to scale from.
  #
  # The hub keeps its state in a SQLite file on the volume below, and fans its
  # WebSockets out in-process — that is a deliberate decision of this repository,
  # which removes Redis and lets the tests run without a container. Two replicas
  # would each get their own volume and their own database, and would know only
  # their own rooms: not a cluster, two hubs.
  replicas: 1
  updateStrategy:
    # A StatefulSet's rolling update terminates a pod before starting its
    # replacement at the same ordinal — it never overlaps them. That is the same
    # guarantee `strategy: Recreate` bought on the Deployment, and the reason it
    # was needed: a rollout that starts the new pod before the old one has let go
    # would put two writers on one SQLite file. It still costs a few seconds of
    # interruption on every deploy, which is a thing to do outside an event.
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hub
    spec:
      # The graceful shutdown drains the requests, cuts the WebSockets and closes
      # the database, giving up after five seconds of its own accord. Twenty
      # leaves room without making a stuck pod linger.
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        # `node`, the user the image already runs as. Repeated here so the cluster
        # enforces it rather than trusting the image.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hub
          image: ghcr.io/monpoke/conference-operator/hub:0.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          # `MODE=production`, the listen address and `DATABASE_PATH=/data/hub.db`
          # are already set by the image: they are not repeated here, so that
          # there is one place to read them.
          envFrom:
            - configMapRef:
                name: hub
            - secretRef:
                name: hub
          volumeMounts:
            - name: data
              mountPath: /data
          # `/health` touches neither the database nor the programme: it answers
          # as long as Fastify is listening, which is the question a probe asks.
          startupProbe:
            httpGet:
              path: /health
              port: http
            # The first start imports the programme and runs the migrations.
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            # `readOnlyRootFilesystem: true` is within reach — the hub writes its
            # database and the programme's images, both under /data — but it has
            # not been run that way here. Turning it on means mounting an
            # `emptyDir` on /tmp and watching the first start.
          resources:
            # A starting point, not a measurement: the image is a Node process
            # serving a handful of rooms and a console. Watch it for an hour
            # before trusting these.
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
  volumeClaimTemplates:
    # The hub's database, and the programme's images beside it. The claim is
    # named `data-hub-0` once created, and **it outlives the StatefulSet**:
    # deleting the StatefulSet leaves it, and re-applying picks it back up.
    # Removing it is a separate, deliberate `kubectl delete pvc`.
    #
    # One gibibyte is generous: a SQLite file holding the programme, the
    # operators, the pairings and the moderation of a day, plus the images the
    # rooms come to fetch — a couple of megabytes for an event, since they are
    # logos and portraits. The rushes never pass through: they go from the rooms
    # to S3.
    #
    # `ReadWriteOnce` is not a limitation to work around: SQLite tolerates
    # exactly one writer, which is also why this stays at one replica.
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        # Left to the cluster's default. A named class goes here.
        # storageClassName: ""
